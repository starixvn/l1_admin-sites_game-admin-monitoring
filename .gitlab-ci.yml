include:
  - project: "ci/repos-ci/pentagon_l1_admin_monitoring_site"
    ref: master
    file: "gitlab-ci.yml"

  - project: "ci/repos-ci/pentagon_l2_admin_monitoring_site"
    ref: master
    file: "gitlab-ci-mixing.yml"

.base_transform_config_script: &base_transform_config_script
  stage: transform-config
  extends:
    - .build:image:l1_admin_monitoring_site:rules
  tags:
    - docker

  script:
    - echo "====== Build NextJS ======"
    - echo $DEPLOY_ENV
    - echo $STACK_NAME
    - cp ./src/game-admin-client/configs/$STACK_NAME/configs.$DEPLOY_ENV.json ./src/game-admin-client/configs.json
    - cat ./src/game-admin-client/configs.json

  artifacts:
    paths:
      - ./src/game-admin-client/configs.json
    expire_in: 1 day

.base_transform_config_l1_admin_monitoring_site:
  <<: *base_transform_config_script
  extends:
    - .deploy_vars_l1_admin_monitoring_site
    - .build:image:l1_admin_monitoring_site:rules
.base_transform_config_l2_admin_monitoring_site:
  <<: *base_transform_config_script
  extends:
    - .deploy_vars_l2_admin_monitoring_site
    - .build:image:l2_admin_monitoring_site:rules
