include:
  - project: "ci/repos-ci/pentagon_l1_admin_monitoring_site"
    ref: master
    file: "gitlab-ci.yml"

.base_transform_config:
  stage: transform-config
  tags:
    - docker

  script:
    - echo "====== Build NextJS ======"
    - echo $DEPLOY_ENV
    - cp ./src/game-admin-client/configs/configs.$DEPLOY_ENV.json ./src/game-admin-client/configs.json
    - cat ./src/game-admin-client/configs.json
  
  artifacts:
    paths:
      - ./src/game-admin-client/configs.json
    expire_in: 1 day
